---
# Local hooks only: they run the ruff the dev dependency group installed, so
# nothing is fetched at hook time. Shared CI components run
# `pre-commit run --all-files` and fail when this file is missing.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: ruff format --check --force-exclude
        language: system
        types: [python]
        require_serial: true

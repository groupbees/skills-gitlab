# yaml-language-server: $schema=https://raw.githubusercontent.com/groupbees/skillmgr/main/schema/skillmgr.schema.json
#
# Deploys this module's own skills into THIS repo (.claude/skills and
# .agents/skills, both gitignored), so an agent working on the catalog uses the
# catalog — the meta skills included. CI runs `skillmgr validate` on it.
#
# To install skills-core on your machine or in a project, do NOT point at this
# file: declare skills-core as a git source in your own skillmgr.yaml — see
# examples/.
repos:
  - repo: local
    paths:
      - path: skills
        recurse: true

name: ci

# Validation for a GroupBees skills module. Same three checks in every module
# (skills-core, skills-slides, …): the skills are spec-valid and deployable by
# skillmgr, the generated README table is up to date, and the catalog script is
# sane.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # agent-ecosystem/skill-validator — pinned; bump deliberately.
  SKILL_VALIDATOR_VERSION: v1.6.1
  # groupbees/skillmgr — no release published yet, so pinned to a commit;
  # switch to a release archive once v0.1.0 is out.
  SKILLMGR_REV: d8ccc6624c5a4cb816e1fcc30684d617c55de943

jobs:
  validate-skills:
    name: Validate SKILL.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install skill-validator
        run: go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@${{ env.SKILL_VALIDATOR_VERSION }}

      # The validator takes ONE skill directory at a time, and our catalog nests
      # skills under a domain folder (skills/<domain>/<name>/), so we loop.
      # --strict → warnings fail the build, a skill never drifts out of spec.
      # --allow-dirs=templates → bundled assets live in templates/ (the spec's
      # own name is assets/; we keep templates/ for readability).
      - name: skill-validator check
        run: |
          failed=0
          for skill in $(find skills -name SKILL.md -exec dirname {} \; | sort); do
            echo "::group::$skill"
            skill-validator check --strict --allow-dirs=templates \
              --emit-annotations "$skill" || failed=$((failed + 1))
            echo "::endgroup::"
            {
              echo "### $skill"
              skill-validator check --allow-dirs=templates -o markdown "$skill" || true
            } >> "$GITHUB_STEP_SUMMARY"
          done
          echo "$failed skill(s) failed validation."
          test "$failed" -eq 0

  skillmgr-validate:
    name: skillmgr validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Built from a checkout, not `cargo install --git`: only a build inside
      # the repo honours its rust-toolchain.toml (rustup fetches that compiler).
      - name: Install skillmgr
        run: |
          git clone --quiet https://github.com/groupbees/skillmgr "$RUNNER_TEMP/skillmgr"
          git -C "$RUNNER_TEMP/skillmgr" checkout --quiet "$SKILLMGR_REV"
          (cd "$RUNNER_TEMP/skillmgr" && cargo install --locked --path .)
      # Parses skillmgr.yaml and checks every skill it selects against the
      # Agent Skills spec — exactly what a consumer's `skillmgr update` does.
      - run: skillmgr validate

  check-catalog:
    name: Catalog (README table, unique names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The table is generated from every SKILL.md `description`; a stale table
      # means a skill was added or reworded without regenerating it.
      - name: Check generated table
        run: scripts/skills-catalog.sh --check-readme
      # Skills deploy flat: skills/<domain>/<name> must be unique on <name>.
      - name: Check unique skill names
        run: scripts/skills-catalog.sh --check-names

  lint-scripts:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # shellcheck ships on the GitHub runners.
      - run: shellcheck scripts/*.sh
